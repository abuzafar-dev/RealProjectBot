[project]
name = "realprojectbot"
version = "1.1.0"
description = "Vaqti kelganda o'zi eslatadigan shaxsiy vazifalar boti (aiogram 3 + SQLite)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "single"
